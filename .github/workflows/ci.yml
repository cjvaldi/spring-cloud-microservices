name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 1. Compilar e instalar biblioteca común (libs-msvc-commons)
        run: mvn -B clean install -f libs-msvc-commons/pom.xml -DskipTests

      - name: 2. Ejecutar pruebas e integración con Testcontainers (msvc-products)
        run: mvn -B clean verify -f msvc-products/pom.xml

      - name: 3. Validar compilación de servicios clave
        run: |
          mvn -B compile -f eureka-server/pom.xml
          mvn -B compile -f config-server/pom.xml
          mvn -B compile -f msvc-gateway-server/pom.xml
          mvn -B compile -f msvc-items/pom.xml
          mvn -B compile -f msvc-users/pom.xml
          mvn -B compile -f msvc-oauth/pom.xml