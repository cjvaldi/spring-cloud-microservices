name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e instalar commons
        run: |
          if [ -d "libs-msvc-commons" ]; then
            mvn -B clean install -f libs-msvc-commons/pom.xml -DskipTests
          fi

      - name: Ejecutar verificación y pruebas (con Testcontainers)
        run: mvn -B clean verify