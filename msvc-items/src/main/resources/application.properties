spring.application.name=msvc-items
# Puerto fallback local (se sobreescribirá si msvc-items-dev.properties define otro)
server.port=8002

# Spring Cloud Discovery Client Configuration
# spring.cloud.discovery.client.simple.instances.msvc-products[0].uri=http://localhost:8001
# spring.cloud.discovery.client.simple.instances.msvc-products[1].uri=http://localhost:9002

# OBLIGATORIO: Evita el java.lang.NullPointerException al ejecutar /actuator/refresh
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# Configuración de Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Configuración de URLs y clientes
config.baseurl.endpoint.msvc-products=http://msvc-products

# Exposición de Actuator en la capa web
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

