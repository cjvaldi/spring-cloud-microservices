resilience4j:
  circuitbreaker:
    configs:
      defecto:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
    instances:
      products:
        base-config: defecto    
  timelimiter:
    configs:
      defecto:
        timeout-duration: 3s
    instances:
      products:
        base-config: defecto 

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:9100
      client:
        registration:
          client-app:
            provider: spring
            client-id: gateway-app
            client-secret: "12345"
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8090/authorized
            # redirect-uri: http://127.0.0.1:8090/login/oauth2/code/client-app
            scope:
              - openid
              - profile
              # - write
              # - read
            client-name: client-app
        provider:
          spring:
            issuer-uri: http://127.0.0.1:9100
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: msvc-oauth
            uri: lb://msvc-oauth
            predicates:
            - Path=/api/security/**
            filters:
            - StripPrefix=2
          - id: msvc-users
            uri: lb://msvc-users
            predicates:
            - Path=/api/users/**
            filters:
            - StripPrefix=2
          - id: msvc-products
            uri: lb://msvc-products
            predicates:
            - Path=/api/products/**
            # - Header=token, 12345 # se pueden agregar expresiones regulares \d+
            # - Method=GET, POST
            # - Query=color, verde  # si se emite el valor acepta cualquier valor.
            # - Cookie=color, azul
            # - Header=Content-Type, application/json
            filters:
            - name: CircuitBreaker
              args:
                name: products
                statusCodes: 500
                fallbackUri: forward:/api/items/5
            - StripPrefix=2
            # Ejemplos alternativos de uso de filtros, este es usando todos los pararmetros posibles
            # - name: SampleCookie
            #   args:
            #     message: Hola mi mensaje personalizado para productos!
            #     name: user
            #     value: Cristian
            # Usando todos los pararmetros en una solo linea ->implementa una funcion en la clase principal.
            #- SampleCookie=Hola mi mensaje personalizado para productos!, user, Cristian
            # Usando nombre diferente->implementar sobrescribiendo el método name() en la clase principal.
            # - EjemploCookie=Hola mi mensaje personalizado para productos!, user, Cristian
            # Si no lleva algun parametro se puede omitir, porque esta validado el nullable en la clase principal.
          - id: msvc-items
            uri: lb://msvc-items
            predicates:
            - Path=/api/items/**
            filters:
            - StripPrefix=2
            - AddRequestHeader=token-request, aabbfsfsfsdfs
            - AddResponseHeader=token-response, 158745874
            - AddRequestParameter=name, Cristian
            - SetResponseHeader=Content-Type, text/plain
            